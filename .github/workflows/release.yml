name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # cr package rebuilds dependencies against the not-yet-updated Pages
      # index. Package with Helm instead, preserving checkout-local subcharts.
      - name: Package charts with vendored dependencies
        run: |
          mkdir -p .cr-release-packages
          for chart in \
            massbank-api \
            massbank-data \
            massbank-dbtool \
            massbank-export-api \
            massbank-frontend \
            massbank-similarity-api
          do
            helm dependency build "charts/$chart"
            helm package "charts/$chart" --destination charts/massbank/charts
            helm package "charts/$chart" --destination .cr-release-packages
          done

          helm dependency list charts/massbank |
            awk '$3 ~ /^oci:\/\// {print $1, $2, $3}' |
            while read -r name version repository; do
              helm pull "$repository/$name" --version "$version" \
                --destination charts/massbank/charts
            done
          helm package charts/massbank --destination .cr-release-packages

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.8.0
        with:
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
