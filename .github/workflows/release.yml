name: Release Charts

on:
  push:
    branches:
      - main

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Hide umbrella chart
        run: mv charts/massbank "$RUNNER_TEMP/massbank"

      - name: Release subcharts
        uses: helm/chart-releaser-action@v1.8.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Restore umbrella chart
        run: mv "$RUNNER_TEMP/massbank" charts/massbank

      - name: Wait for dependencies in Helm repository
        run: |
          helm repo add massbank https://massbank.github.io/MassBank-charts
          for attempt in {1..18}; do
            helm repo update massbank
            if helm dependency update charts/massbank; then
              exit 0
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "Umbrella dependencies did not become available after 18 attempts" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Release all charts
        uses: helm/chart-releaser-action@v1.8.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
