{{- if .Values.withPostgres }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: massbank-export-api-postgres-config
  labels:
    {{- include "massbank-export-api.labels" . | nindent 4 }}
data:
  000_bingo_install.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f /opt/bingo-postgres/init-scripts/000_bingo_install.sql
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -c "UPDATE bingo.bingo_config SET cvalue = '1' WHERE trim(cname) = 'ALLOW_NON_UNIQUE_DEAROMATIZATION'"
{{- end }}
